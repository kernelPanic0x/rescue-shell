name: Build and Release Latest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARY_NAME: "rescue-shell"

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
            rustflags: ""
            ext: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
            rustflags: ""
            ext: ""
          - target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            use_zigbuild: true
            rustflags: ""
            ext: ""
          - target: aarch64-linux-android
            os: ubuntu-latest
            use_zigbuild: false
            rustflags: ""
            ext: ""
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            use_zigbuild: true
            rustflags: ""
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            use_zigbuild: false
            rustflags: ""
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            use_zigbuild: false
            rustflags: ""
            ext: ""
          # --- Windows Targets ---
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_zigbuild: false
            rustflags: ""
            ext: ".exe"
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use_zigbuild: false
            rustflags: ""
            ext: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        run: pip install cargo-zigbuild

      - name: Install cargo-ndk
        if: matrix.target == 'aarch64-linux-android'
        run: cargo install cargo-ndk

      - name: Build binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CARGO_NDK_PLATFORM: "23"
        run: |
          if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
            cargo ndk -t aarch64-linux-android build --release
          elif [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare artifact
        run: |
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${{ matrix.ext }} ./${{ env.BINARY_NAME }}-${{ matrix.target }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: ./${{ env.BINARY_NAME }}-${{ matrix.target }}${{ matrix.ext }}

  publish:
    name: Update Latest Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 2
          gh release create latest \
            --target ${{ github.sha }} \
            --title "Latest Development Build" \
            --notes "Automated build from the main branch." \
            --prerelease \
            ./${{ env.BINARY_NAME }}-*
