name: Build and Release Latest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARY_NAME: "rescue-shell"

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - arm-unknown-linux-musl

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-zigbuild and Zig
        run: pip install cargo-zigbuild

      - name: Build with cargo-zigbuild
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Compress with UPX and prepare artifact
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          BIN_PATH=$(find target/${{ matrix.target }}/release -maxdepth 1 -type f -executable ! -name "*.d" | head -n 1)
          upx --best --lzma "$BIN_PATH"
          cp "$BIN_PATH" ./${{ env.BINARY_NAME }}-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: ./${{ env.BINARY_NAME }}-${{ matrix.target }}

  publish:
    name: Update Latest Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 2
          gh release create latest \
            --target ${{ github.sha }} \
            --title "Latest Development Build" \
            --notes "Automated build from the main branch." \
            --prerelease \
            ./${{ env.BINARY_NAME }}-*
