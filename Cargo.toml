[package]
name = "rescue-shell"
version = "0.1.0"
edition = "2024"
description = "A remote rescue shell that runs everywhere, all at once."
authors = ["Elias Dalbeck <eliasdalbeck42@gmail.com>"]

[workspace]
members = ["wormhole-cli"]

[workspace.dependencies]
magic-wormhole = { version = "0.8.1", features = ["fuzzy-complete"] }
clap = { version = "4", features = ["derive", "env", "cargo"] }
serde = { version = "1", features = ["derive"] }
url = "2.5.8"
serde_json = "1.0.151"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
incremental = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { workspace = true }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dialoguer = { version = "0.12.0", features = ["completion"] }
futures = "0.3.33"
hex = "0.4.3"
iroh = { version = "1.0.3", features = ["unstable-net-report"] }
libc = "0.2.189"
magic-wormhole = { workspace = true }
wormhole-cli = { path = "./wormhole-cli" }
n0-error = "1.0.0"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
strum = "0.28.0"
strum_macros = "0.28.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-serde = { version = "0.9.0", features = ["bincode"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
url = { workspace = true }
vt100 = "0.16.2"
wincode = { version = "0.6.0", features = ["bytes", "derive"] }
vte = "0.15.0"

[target.'cfg(unix)'.dependencies]
signal-hook-tokio = "0.4"
signal-hook = "0.3"
