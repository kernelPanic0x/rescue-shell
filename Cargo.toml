[package]
name = "rescue-shell"
version = "0.1.0"
edition = "2024"
description = "A remote rescue shell that runs everywhere, all at once."
authors = ["Elias Dalbeck <eliasdalbeck42@gmail.com>"]

[lints.clippy]
disallowed_types = "deny"
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"

# 1. Eliminate unhandled panics and debugging leftovers
unwrap_used = "warn"        # Prefer ? or pattern matching over .unwrap()
dbg_macro = "warn"          # Catch leftover dbg!() calls
todo = "warn"               # Catch leftover todo!()
unimplemented = "warn"      # Catch leftover unimplemented!()
panic = "warn"              # Catch explicit panic!() calls
panic_in_result_fn = "warn" # Catches functions returning Result that still panic

# 2. Performance & Memory Smells
clone_on_ref_ptr = "warn"       # Prefer Arc::clone(&x) over x.clone() (clarifies cost)
redundant_clone = "warn"        # Catches clones where the source is no longer used
rc_buffer = "warn"              # Catches Arc<Vec<T>> / Rc<String> instead of Arc<[T]> / Rc<str>
needless_pass_by_value = "warn" # Suggests taking &T instead of T when ownership isn't needed

# 3. Defensive Programming & Safety
indexing_slicing = "warn" # Catches arr[i] which might panic; forces .get() or slicing checks
float_cmp = "warn"        # Catches exact float comparisons (== / !=)
shadow_reuse = "warn"     # Catches overly confusing variable shadowing

[workspace]
members = ["wormhole-cli"]

[workspace.dependencies]
magic-wormhole = { version = "0.8.1", features = ["fuzzy-complete"] }
clap = { version = "4.6.6", features = ["std", "derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
url = { version = "2.5.8", default-features = false }
serde_json = "1.0.151"
dialoguer = { version = "0.12.0", features = ["completion"] }
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "fs",
  "time",
  "sync",
  "signal",
] }
tokio-util = { version = "0.7.19", features = ["codec", "compat"] }
color-eyre = { version = "0.6", default-features = false, features = [
  "track-caller",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
incremental = false

[dependencies]
color-eyre = { workspace = true }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { workspace = true }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dialoguer = { workspace = true }
hex = "0.4.3"
iroh = { version = "1.0.3", features = ["unstable-net-report"] }
libc = "0.2.189"
magic-wormhole = { workspace = true }
wormhole-cli = { path = "./wormhole-cli" }
n0-error = "1.0.0"
portable-pty = "0.9.0"
serde = { version = "1.0", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
strum = { version = "0.28", default-features = false, features = ["derive"] }
strum_macros = "0.28.0"
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
url = { workspace = true }
vt100 = "0.16.2"
wincode = { version = "0.6.0", features = ["bytes", "derive"] }
vte = "0.15.0"
async-compression = { version = "0.4.43", features = ["lz4", "tokio"] }
getrandom = "0.4.3"
parking_lot = "0.12.5"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_System_Console",
  "Win32_Foundation",
] }
