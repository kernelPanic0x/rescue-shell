[package]
name = "rescue-shell"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dialoguer = { version = "0.12.0", features = ["completion"] }
futures = "0.3.33"
libc = "0.2.189"
magic-wormhole = "0.8.1"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.4"
signal-hook-tokio = "0.4.0"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
wincode = { version = "0.6.0", features = ["derive"] }
