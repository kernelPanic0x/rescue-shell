[package]
name = "rescue-shell"
version = "0.1.0"
edition = "2024"
description = "A remote rescue shell that runs everywhere, all at once."
authors = ["Elias Dalbeck <eliasdalbeck42@gmail.com>"]

[lints.clippy]
disallowed_types = "deny"

[workspace]
members = ["wormhole-cli"]

[workspace.dependencies]
magic-wormhole = { version = "0.8.1", features = ["fuzzy-complete"] }
clap = { version = "4", default-features = false, features = [
  "std",
  "derive",
  "env",
] }
serde = { version = "1", features = ["derive"] }
url = { version = "2.5", default-features = false }
serde_json = "1.0.151"
dialoguer = { version = "0.12.0", features = ["completion"] }
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "fs",
  "time",
  "sync",
  "signal",
] }
tokio-util = { version = "0.7.19", features = ["codec", "compat"] }
color-eyre = { version = "0.6", default-features = false, features = [
  "track-caller",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
incremental = false

[dependencies]
color-eyre = { workspace = true }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { workspace = true }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dialoguer = { workspace = true }
hex = "0.4.3"
iroh = { version = "1.0.3", features = ["unstable-net-report"] }
libc = "0.2.189"
magic-wormhole = { workspace = true }
wormhole-cli = { path = "./wormhole-cli" }
n0-error = "1.0.0"
portable-pty = "0.9.0"
serde = { version = "1.0", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
strum = { version = "0.28", default-features = false, features = ["derive"] }
strum_macros = "0.28.0"
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
tokio-serde = { version = "0.9.0", features = ["bincode"] }
url = { workspace = true }
vt100 = "0.16.2"
wincode = { version = "0.6.0", features = ["bytes", "derive"] }
vte = "0.15.0"
async-compression = { version = "0.4.43", features = ["lz4", "tokio"] }
getrandom = "0.4.3"
parking_lot = "0.12.5"

[target.'cfg(unix)'.dependencies]
signal-hook-tokio = "0.4"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_System_Console",
  "Win32_Foundation",
] }
